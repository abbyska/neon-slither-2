<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Slither 2</title>
    <meta name="description" content="A premium neon-style snake game optimized for mobile.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div class="score-container">
                    <span class="label">SCORE</span>
                    <span id="score-value">0</span>
                </div>
                <div class="score-container">
                    <span class="label">BEST</span>
                    <span id="highscore-value">0</span>
                </div>
                <div class="score-container name-badge">
                    <span class="label">PLAYER</span>
                    <span id="hud-name">Loading...</span>
                </div>
            </div>

            <div id="start-screen" class="screen">
                <div class="logo-container">
                    <img src="logo.png" alt="Neon Slither Logo" class="game-logo">
                </div>
                <h1 class="title">NEON<br>SLITHER 2</h1>

                <div id="player-identity" class="identity-box">
                    <span class="label">PLAYING AS</span>
                    <span id="start-name" class="pulsate-text">...</span>
                </div>

                <div class="difficulty-container">
                    <span class="label">SELECT DIFFICULTY</span>
                    <div class="difficulty-buttons">
                        <button class="btn-diff active" data-speed="100">BEGINNER</button>
                        <button class="btn-diff" data-speed="70">ADVANCED</button>
                        <button class="btn-diff" data-speed="50">EXPERT</button>
                    </div>
                </div>

                <div class="instructions">
                    <p>Collect glowing orbs to grow.</p>
                    <p>Don't hit the walls or yourself!</p>
                </div>

                <div class="controls-container">
                    <div class="control-group">
                        <div class="icon-desktop">⌨️</div>
                        <span>Arrow Keys</span>
                    </div>
                    <div class="divider">OR</div>
                    <div class="control-group">
                        <div class="icon-mobile">👆</div>
                        <span>Swipe</span>
                    </div>
                </div>

                <p class="subtitle pulsate">TAP TO START</p>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h2 class="title">GAME OVER</h2>
                <div class="final-score">
                    <span class="label">SCORE</span>
                    <span id="final-score-value">0</span>
                </div>

                <div id="leaderboard-display">
                    <h3>TOP SLITHERS</h3>
                    <ul id="leaderboard-list">
                        <!-- Items injected by JS -->
                    </ul>
                </div>

                <button id="restart-btn" class="btn-neon">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
